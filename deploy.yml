name: Despliegue Automático Expansis Pro

on:
  push:
    branches:
      - main # Asegúrate de que esta sea tu rama principal (o cámbiala por master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Aquí es donde se ejecuta tu compilación/prerenderizado
      - name: Compilar proyecto
        run: npm run build

      # Aquí GitHub toma tu carpeta "build" y la sube usando tu target "expansis"
      - name: Desplegar en Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:expansis --token "${{ secrets.FIREBASE_TOKEN }}"
