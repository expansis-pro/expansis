# .github/workflows/firebase-hosting-merge.yml

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master # O 'master' si esa es tu rama principal
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # Usa v3 o una versión más reciente
      # Si tu proyecto necesita un paso de compilación (build), añádelo aquí. Por ejemplo:
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: expansispro-react # <-- IMPORTANTE: Asegúrate de que este es el ID correcto de tu proyecto de Firebase
