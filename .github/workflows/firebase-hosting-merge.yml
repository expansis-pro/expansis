# .github/workflows/firebase-hosting-merge.yml

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/997758829677/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-action-954993077@expansispro-react.iam.gserviceaccount.com'

      - name: 'Build Project'
        run: npm ci && npm run build

      # --- NUEVOS PASOS DE DESPLIEGUE ---

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:expansis --project expansispro-react --non-interactive
