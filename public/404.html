<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Error de Arquitectura | Expansis Pro</title>

  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">

  <style>
    /* Variables de Marca Expansis Pro */
    :root {
      --deepBlue: #020617;
      /* El azul oscuro profundo que buscabas */
      --primario: #f27405;
      /* Tu naranja de marca */
      --ghostWhite: #f8fafc;
      --slate400: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--deepBlue);
      color: var(--ghostWhite);
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Fondo de cuadrícula técnica sutil */
    .grid-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.1;
      background-image:
        linear-gradient(to right, #1e293b 1px, transparent 1px),
        linear-gradient(to bottom, #1e293b 1px, transparent 1px);
      background-size: 40px 40px;
    }

    #container {
      position: relative;
      z-index: 10;
      max-width: 600px;
      padding: 2rem;
      text-align: center;
    }

    .error-code {
      font-size: clamp(8rem, 15vw, 12rem);
      /* Tamaño fluido */
      font-weight: 700;
      color: var(--primario);
      margin: 0;
      line-height: 0.8;
      letter-spacing: -0.05em;
      filter: drop-shadow(0 0 15px rgba(242, 116, 5, 0.2));
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      margin: 1.5rem 0 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 3rem;
      color: var(--slate400);
      font-weight: 300;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--primario);
      text-transform: uppercase;
      text-decoration: none;
      color: white;
      padding: 1.25rem 2.5rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 0.15em;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 15px -3px rgba(242, 116, 5, 0.3);
    }

    .btn-back:hover {
      transform: translateY(-5px);
      filter: brightness(1.1);
      box-shadow: 0 20px 25px -5px rgba(242, 116, 5, 0.4);
    }

    /* Un detalle extra: un círculo de luz sutil en el centro */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(242, 116, 5, 0.05) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div id="container">
    <div class="error-code">404</div>
    <h1>Error de Arquitectura</h1>
    <p>La coordenada solicitada no existe o ha sido reubicada dentro de nuestra infraestructura digital.</p>

    <a href="https://expansispro.com/" class="btn-back">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Reiniciar Navegación
    </a>
  </div>
</body>

</html>
